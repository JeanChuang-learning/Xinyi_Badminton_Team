name: Keep Webhook Awake

on:
  schedule:
    # 每 10 分鐘一次，Render 免費方案通常是閒置 15 分鐘後才會休眠
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping webhook health check
        run: curl -sf https://xinyi-badminton-team.onrender.com/ || true
