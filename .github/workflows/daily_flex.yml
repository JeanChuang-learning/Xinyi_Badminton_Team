name: Daily Flex Signup Notice

on:
  schedule:
    # UTC 00:00 = 台灣時間 08:00
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  send-flex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install supabase requests

      - run: python send_daily_flex.py
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:              ${{ secrets.SUPABASE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_GROUP_ID_CASUAL:      ${{ secrets.LINE_GROUP_ID_CASUAL }}
          LINE_GROUP_ID_MEMBER:      ${{ secrets.LINE_GROUP_ID_MEMBER }}
